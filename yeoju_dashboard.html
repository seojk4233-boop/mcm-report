<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>여주성주센터 관리지표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"><\/script>
<style>
:root{
  --bg:#f2f6fb;--card:#fff;--ink:#0d1f2d;--sub:#4a6278;--muted:#7a90a3;
  --line:#dce8f0;--blue:#2563eb;--blue-lt:#eff4ff;--green:#059669;
  --green-lt:#ecfdf5;--red:#e11d48;--red-lt:#fff1f2;--amber:#d97706;
  --amber-lt:#fffbeb;--purple:#7c3aed;--teal:#0d9488;
  --shadow-sm:0 1px 4px rgba(13,31,45,.06);--shadow:0 4px 16px rgba(13,31,45,.08);
  --r:14px;--font-num:'Figtree','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR','Figtree',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:1560px;margin:0 auto;padding:16px 24px 20px}
.top{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
.brand p{font-size:14px;color:var(--sub);font-weight:500;margin-top:3px}
.tabs{flex:1;display:flex;justify-content:center;gap:8px}
.tab{border:1px solid var(--line);background:var(--card);padding:11px 28px;border-radius:10px;font-family:var(--font-body);font-weight:700;font-size:15px;color:var(--sub);cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.filter-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.filter{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.filter small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:3px}
.filter select{border:0;outline:0;font-family:var(--font-body);font-weight:700;font-size:15px;color:var(--ink);background:transparent;cursor:pointer}
.note{font-size:13px;color:var(--muted);font-weight:500}
.section{display:none}.section.active{display:block}
.sec-title{font-size:18px;font-weight:800;color:var(--blue);margin-bottom:16px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;box-shadow:var(--shadow-sm)}
.kpi .label{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:8px}
.kpi .value{font-family:var(--font-num);font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--ink);line-height:1}
.unit{font-size:15px;font-weight:600;font-family:var(--font-body);margin-left:3px}
.compare{display:flex;gap:16px;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.compare div{font-size:13px;color:var(--sub);font-weight:600;line-height:1.65}
.up{color:var(--green)!important}.down{color:var(--red)!important}.warn{color:var(--amber)!important}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:5px 10px;font-size:14px;font-weight:700;background:var(--blue-lt);color:var(--blue)}
.pill.up{background:var(--green-lt);color:var(--green)}.pill.down{background:var(--red-lt);color:var(--red)}.pill.warn{background:var(--amber-lt);color:var(--amber)}
/* 인사이트 배너 */
.ins3{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px;background:#111e30;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ins3-item{padding:20px 24px;border-right:1px solid rgba(255,255,255,.12);text-align:left}
.ins3-item:last-child{border-right:none}
.ins3-tag{display:inline-block;border-radius:7px;padding:4px 12px;font-size:13px;font-weight:800;background:#04301a;color:#5edf9a;margin-bottom:10px}
.ins3-item p{font-size:14px;font-weight:500;line-height:1.7;color:#b8d4f0;text-align:left}
.ins3-item p b{color:#fff}
/* 그리드 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.star-bar{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--blue);line-height:1.5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.panel-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:12px}
.panel-title .badge{font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:7px;padding:4px 9px}
.bar-item{margin:10px 0}
.bar-head{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.track{height:7px;background:#eaf0f6;border-radius:10px;margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:10px;background:var(--blue);transition:width .4s}
.mini{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.table{width:100%;border-collapse:collapse}
.table th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.table th.numtd{text-align:right}
.table td{padding:9px 6px;border-bottom:1px solid #eef3f8;font-size:14px;font-weight:600;color:var(--ink)}
.table td.numtd{text-align:right;font-family:var(--font-num);font-weight:700}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:12px;font-weight:800;color:var(--sub)}
.flag-img{width:20px;height:14px;object-fit:cover;border-radius:2px;margin-right:6px;vertical-align:-2px}
/* 지도 */
.map-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(13,31,45,.07);margin-bottom:8px}
.map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px;font-weight:800}
.map-detail-btn{border:1px solid #b0caf5;background:var(--blue-lt);color:var(--blue);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.map-detail-btn:hover{background:var(--blue);color:#fff}
#map1,.modal-map-box{background:radial-gradient(circle at 16% 34%,rgba(96,165,250,.14),transparent 20%),radial-gradient(circle at 74% 40%,rgba(96,165,250,.14),transparent 22%),linear-gradient(180deg,#eaf5ff 0%,#f8fbff 100%);border-radius:18px;overflow:hidden;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.map-tooltip{position:absolute;z-index:30;display:none;min-width:175px;background:rgba(255,255,255,.97);border:1px solid #cce0f5;border-radius:12px;box-shadow:0 8px 24px rgba(13,31,45,.14);padding:12px 14px;pointer-events:none;font-family:var(--font-body)}
.map-tooltip .t-title{font-size:14px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.map-tooltip .t-main{font-family:var(--font-num);font-size:22px;font-weight:800;color:var(--blue)}
.map-tooltip .t-sub{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;font-weight:600}
.land{fill:#d7e7f5;stroke:#fff;stroke-width:.55;stroke-linejoin:round;stroke-linecap:round}
/* 지도 줌 버튼 */
.map-zoom-btns{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:20}
.map-zoom-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.95);font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.map-zoom-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
/* 재고 */
.dark-strip{background:#111e30;color:#cee3ff;border-radius:var(--r);padding:20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:16px}
.dark-strip>div{display:flex;flex-direction:column;align-items:flex-start}
.dark-strip p{font-size:14px;font-weight:500;line-height:1.7;color:#b8d4f0;text-align:left}
.dark-strip p b{color:#fff}
.tag{display:inline-block;border-radius:7px;padding:4px 12px;font-size:13px;font-weight:800;margin-bottom:8px}
.tag.green{background:#04301a;color:#5edf9a}.tag.purple{background:#2a1a60;color:#b8a4fd}
.tag.amber{background:#42260a;color:#f5c05a}
.pareto-bar-row{display:flex;height:24px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.pareto-bar-row div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.pareto-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pareto-legend span{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--sub)}
.pareto-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
.sku-insight{background:linear-gradient(135deg,#fffbeb,#fef9ec);border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;color:#78350f;font-weight:600;line-height:1.65}
.inv-tip{background:#f0f6ff;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px;color:var(--sub);font-weight:600;line-height:1.6;margin-top:10px}
.inv-tip b{color:var(--ink)}
/* 리스크 */
.risk-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.risk-kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm)}
.risk-kpi .rlabel{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.risk-kpi .rval{font-family:var(--font-num);font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.risk-kpi .rdesc{font-size:13px;color:var(--muted);font-weight:600;margin-top:5px}
.risk-kpi.danger .rval{color:var(--red)}.risk-kpi.warn-k .rval{color:var(--amber)}.risk-kpi.good .rval{color:var(--green)}.risk-kpi.neutral .rval{color:var(--ink)}
.rbadge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:20px}
.rbadge.danger{background:var(--red-lt);color:var(--red)}.rbadge.warn{background:var(--amber-lt);color:var(--amber)}.rbadge.good{background:var(--green-lt);color:var(--green)}.rbadge.info{background:var(--blue-lt);color:var(--blue)}
.risk-charts{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:16px}
.risk-chart-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.risk-chart-wrap{position:relative;width:100%;height:220px}
.country-risk-bar{display:flex;align-items:center;gap:10px;margin:10px 0}
.crb-name{width:82px;font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-shrink:0}
.crb-wrap{flex:1;height:10px;background:#eaf0f6;border-radius:10px;overflow:hidden}
.crb-fill{height:100%;border-radius:10px}
.crb-val{width:44px;text-align:right;font-family:var(--font-num);font-size:14px;font-weight:800}
.risk-bottom{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.ai-insight{background:linear-gradient(135deg,#0f2440,#1a3560);border-radius:var(--r);padding:20px 22px;color:#deeeff;box-shadow:var(--shadow)}
.ai-insight h3{font-size:16px;font-weight:800;color:#7bbdff;margin-bottom:14px}
.insight-item{background:rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.insight-item:last-child{margin-bottom:0}
.itag{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0;margin-top:2px}
.itag.red{background:#e11d48;color:#fff}.itag.amber{background:#d97706;color:#fff}.itag.blue{background:#2563eb;color:#fff}.itag.green{background:#059669;color:#fff}
.itext{font-size:14px;font-weight:600;color:#cce2ff;line-height:1.65}.itext b{color:#fff}
.risk-criteria{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.risk-criteria h3{font-size:16px;font-weight:800;margin-bottom:14px}
.crit-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.crit-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.crit-badge{padding:4px 10px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap;flex-shrink:0}
.crit-badge.red{background:var(--red-lt);color:var(--red)}.crit-badge.amber{background:var(--amber-lt);color:var(--amber)}.crit-badge.blue{background:var(--blue-lt);color:var(--blue)}
.crit-text{font-size:14px;color:var(--sub);font-weight:600;line-height:1.6}.crit-text b{color:var(--ink)}
.check-points{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.check-points h3{font-size:16px;font-weight:800;margin-bottom:12px}
.check-points p{font-size:15px;color:var(--sub);font-weight:500;line-height:1.75}
.check-list{margin-top:12px}
.check-list li{font-size:14px;color:var(--sub);font-weight:600;line-height:1.7;list-style:none;border-left:3px solid var(--blue);padding:7px 11px;margin-bottom:8px;background:var(--blue-lt);border-radius:0 6px 6px 0}
/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,20,38,.65);z-index:9999;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{width:97vw;max-width:1300px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.28);padding:20px 24px;border:1px solid var(--line)}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-top h2{font-size:22px;font-weight:800}
.modal-close{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:24px;cursor:pointer;color:var(--sub)}
.modal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.modal-stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.modal-stat small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.modal-stat b{font-family:var(--font-num);font-size:22px;font-weight:800}
.modal-grid{display:grid;grid-template-columns:1.5fr .9fr;gap:16px}
.modal-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.summary-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini-card{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff}
.mini-card small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.mini-card b{font-family:var(--font-num);font-size:22px;font-weight:800}
.country-info-card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#fff,#f4f9ff);padding:18px 22px}
.country-info-card h3{color:var(--blue);font-size:16px;font-weight:800;margin-bottom:8px}
.country-info-card ul{padding-left:18px;color:var(--sub);font-size:14px;font-weight:500;line-height:1.8}
/* 모달 지도 */
#mapModal{background:radial-gradient(circle at 16% 34%,rgba(96,165,250,.14),transparent 20%),radial-gradient(circle at 74% 40%,rgba(96,165,250,.14),transparent 22%),linear-gradient(180deg,#eaf5ff 0%,#f8fbff 100%);border-radius:14px;overflow:hidden;position:relative}
.footer{text-align:right;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px}
@media(max-width:1100px){
  .kpis,.grid4,.risk-kpis{grid-template-columns:1fr 1fr}
  .grid2,.ins3,.dark-strip,.modal-grid,.modal-bottom,.risk-charts,.risk-bottom{grid-template-columns:1fr}
  .top{flex-wrap:wrap}.tabs{overflow-x:auto;justify-content:flex-start}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <h1>여주성주센터 관리지표</h1>
    <p>Operation Control Tower · B2B/B2C 출고 및 재고 운영 현황</p>
  </div>
  <nav class="tabs">
    <button class="tab active" onclick="showTab('monthly',this)">월별 요약</button>
    <button class="tab" onclick="showTab('inventory',this)">재고 현황</button>
    <button class="tab" onclick="showTab('risk',this)">운영 리스크</button>
  </nav>
  <div class="filter-wrap">
    <div class="filter">
      <small>기준월 선택</small>
      <select id="monthSelect" onchange="changeMonth(this.value)">
        <option value="4" selected>2026년 4월</option>
        <option value="3">2026년 3월</option>
        <option value="2">2026년 2월</option>
        <option value="1">2026년 1월</option>
      </select>
    </div>
    <div class="note">* 전월 대비 / 전년 동월 대비</div>
  </div>
</header>

<!-- 월별 요약 -->
<section id="monthly" class="section active">
  <h2 class="sec-title" id="monthly-title">월별 요약 — 2026년 4월</h2>
  <div class="kpis">
    <div class="kpi"><div class="label">총 출고 PCS</div><div class="value" id="m-total">90,125<span class="unit">PCS</span></div><div class="compare"><div>전월 대비<br><span class="up" id="m-total-mom">▲10.7%</span><br><small id="m-total-prev">(81,449 PCS)</small></div><div>전년 동월<br><span class="up" id="m-total-yoy">▲79.9%</span><br><small id="m-total-py">(50,079 PCS)</small></div></div></div>
    <div class="kpi"><div class="label">수출 PCS</div><div class="value" id="m-export">84,327<span class="unit">PCS</span></div><div class="compare"><div>전월 대비<br><span class="up" id="m-exp-mom">▲3.5%</span><br><small id="m-exp-prev">(81,449 PCS)</small></div><div>전년 동월<br><span class="up" id="m-exp-yoy">▲63.4%</span><br><small id="m-exp-py">(51,682 PCS)</small></div></div></div>
    <div class="kpi"><div class="label">국내 PCS</div><div class="value" id="m-domestic">5,798<span class="unit">PCS</span></div><div class="compare"><div>전월 대비<br><span class="up" id="m-dom-mom">▲46.2%</span><br><small id="m-dom-prev">(3,964 PCS)</small></div><div>전년 동월<br><span class="up" id="m-dom-yoy">▲639.6%</span><br><small id="m-dom-py">(784 PCS)</small></div></div></div>
    <div class="kpi"><div class="label">SKU당 PCS</div><div class="value" id="m-skupp">31.2<span class="unit">PCS</span></div><div class="compare"><div>전월 대비<br><span class="down" id="m-sku-mom">▼6.9%</span><br><small id="m-sku-prev">(33.5 PCS)</small></div><div>전년 동월<br><span class="down" id="m-sku-yoy">▼31.5%</span><br><small id="m-sku-py">(45.5 PCS)</small></div></div></div>
    <div class="kpi"><div class="label">출고 SKU</div><div class="value" id="m-sku">3,128<span class="unit">종</span></div><div class="compare"><div>전월 대비<br><span class="up" id="m-skuc-mom">▲5.1%</span><br><small id="m-skuc-prev">(2,977종)</small></div><div>전년 동월<br><span class="up" id="m-skuc-yoy">▲53.7%</span><br><small id="m-skuc-py">(2,036종)</small></div></div></div>

/* ── 지도 ── */
var WORLD_CACHE=null,WORLD_LOADING=false;
function _loadWorld(cb){
  if(WORLD_CACHE){cb(WORLD_CACHE);return;}
  if(WORLD_LOADING){setTimeout(()=>_loadWorld(cb),120);return;}
  WORLD_LOADING=true;
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json()).then(j=>{WORLD_CACHE=j;cb(j);})
    .catch(()=>{WORLD_CACHE='fallback';cb('fallback');});
}

function drawMap(cid){
  _loadWorld(w=>{
    if(w==='fallback'||typeof d3==='undefined'||typeof topojson==='undefined') _drawFallback(cid);
    else _drawDetailed(cid,w);
  });
}

function _applyTransform(cid){
  const isModal=(cid==='mapModal');
  const sc=isModal?modalScale:mapScale;
  const ox=isModal?modalOffX:mapOffX;
  const oy=isModal?modalOffY:mapOffY;
  const box=document.getElementById(cid);
  if(!box)return;
  const svg=box.querySelector('svg');
  if(svg){svg.style.transform='scale('+sc+') translate('+ox+'px,'+oy+'px)';svg.style.transformOrigin='center center';}
}

function _drawDetailed(cid,world){
  const box=document.getElementById(cid);if(!box)return;
  const bw=box.offsetWidth||900;
  const bh=box.offsetHeight||(cid==='mapModal'?420:460);
  if(bw<10){setTimeout(()=>drawMap(cid),200);return;}
  const d=currentData;
  const allPts=[...d.countries,...d.more.filter(c=>c.lon)];
  let mx=0;allPts.forEach(c=>{if(c.pcs>mx)mx=c.pcs;});
  const countries=topojson.feature(world,world.objects.countries).features;
  const proj=d3.geoNaturalEarth1().fitExtent([[18,18],[bw-18,bh-30]],{type:'Sphere'});
  const path=d3.geoPath(proj);
  const graticule=d3.geoGraticule().step([30,30]);
  const oid='og_'+cid,gid='gl_'+cid,bid='bg_'+cid;

  let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+bw+'" height="'+bh+'" viewBox="0 0 '+bw+' '+bh+'" style="display:block;border-radius:16px;cursor:grab">'+
    '<defs>'+
    '<linearGradient id="'+oid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#f8fbff"/></linearGradient>'+
    '<filter id="'+gid+'" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.388 0 0 0 0 0.922 0 0 0 .45 0" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '<radialGradient id="'+bid+'" cx="38%" cy="30%" r="70%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="55%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient>'+
    '</defs>'+
    '<rect width="'+bw+'" height="'+bh+'" fill="url(#'+oid+')"/>'+
    '<path d="'+path({type:'Sphere'})+'" fill="rgba(255,255,255,.18)" stroke="rgba(148,179,210,.28)" stroke-width=".8"/>'+
    '<path d="'+path(graticule())+'" fill="none" stroke="#b7cfe4" stroke-width=".45" opacity=".35"/>'+
    '<g>';
  countries.forEach(c=>{const pd=path(c);if(pd)svg+='<path class="land" d="'+pd+'"/>';});
  svg+='</g>';

  let bubb='',lbl='';
  allPts.forEach(c=>{
    const xy=proj([c.lon,c.lat]);if(!xy)return;
    const cx=xy[0],cy=xy[1];
    const r=Math.sqrt(c.pcs/mx)*(cid==='mapModal'?50:44)+5;
    const up=c.chg.includes('\u25b2');
    // 3겹 버블
    bubb+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+14)+'" fill="#2563eb" opacity="0.09" pointer-events="none"/>';
    bubb+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+6)+'" fill="#2563eb" opacity="0.16" pointer-events="none"/>';
    bubb+='<circle class="mb" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#'+bid+')" fill-opacity="0.92" stroke="rgba(255,255,255,.95)" stroke-width="2.2" filter="url(#'+gid+')" data-n="'+c.name+'" data-p="'+c.pcs.toLocaleString()+'" data-pct="'+c.pct+'" data-c="'+c.chg+'" data-u="'+up+'" data-cd="'+(c.code||'')+'" style="cursor:pointer"/>';
    // 라벨 — 항상 버블 바깥 위쪽
    const below=(c.code==='hk'||c.code==='tw'||c.code==='sg'||c.code==='th'||c.code==='ph'||c.code==='my');
    const y1=below?(cy+r+14):(cy-r-30);
    lbl+='<text x="'+cx+'" y="'+y1+'" text-anchor="middle" fill="#17324d" font-weight="800" font-size="12" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="3" font-family="Noto Sans KR,sans-serif">'+c.name+'</text>';
    lbl+='<text x="'+cx+'" y="'+(y1+14)+'" text-anchor="middle" fill="#2d567a" font-weight="700" font-size="11" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="3" font-family="Figtree,sans-serif">'+c.pcs.toLocaleString()+' PCS</text>';
    lbl+='<text x="'+cx+'" y="'+(y1+26)+'" text-anchor="middle" fill="#4a7090" font-weight="600" font-size="10" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="2" font-family="Figtree,sans-serif">('+c.pct+')</text>';
  });

  const leg='<circle cx="20" cy="'+(bh-20)+'" r="7" fill="#2563eb" fill-opacity=".9"/><text x="33" y="'+(bh-15)+'" fill="#4a6278" font-size="13" font-weight="700" font-family="Noto Sans KR,sans-serif">출고 PCS</text>';
  const existing=box.querySelector('.map-tooltip');
  box.innerHTML=svg+bubb+lbl+leg+'</svg>';
  const tt=document.createElement('div');tt.className='map-tooltip';box.appendChild(tt);

  // 줌 버튼 (map1에만)
  if(cid==='map1'){
    const zb=document.createElement('div');zb.className='map-zoom-btns';
    zb.innerHTML='<button class="map-zoom-btn" onclick="map1Zoom(1.25)">+</button><button class="map-zoom-btn" onclick="map1Zoom(0.8)">−</button><button class="map-zoom-btn" onclick="map1Reset()" style="font-size:12px">⊙</button>';
    box.appendChild(zb);
  }

  _bindTooltip(box,bw,bh);
  _bindDrag(cid);
}

function _drawFallback(cid){
  const box=document.getElementById(cid);if(!box)return;
  const bw=box.offsetWidth||800,bh=box.offsetHeight||(cid==='mapModal'?420:460);
  if(bw<10){setTimeout(()=>_drawFallback(cid),200);return;}
  const d=currentData;
  const allPts=[...d.countries,...d.more.filter(c=>c.lon)];
  let mx=0;allPts.forEach(c=>{if(c.pcs>mx)mx=c.pcs;});
  function xy(lon,lat){return [(lon+180)/360*bw,(90-lat)/180*bh];}
  let bubb='',lbl='';
  allPts.forEach(c=>{
    const p=xy(c.lon,c.lat),cx=p[0],cy=p[1];
    const r=Math.sqrt(c.pcs/mx)*50+5;
    const up=c.chg.includes('\u25b2');
    bubb+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+14)+'" fill="#2563eb" opacity="0.09" pointer-events="none"/>';
    bubb+='<circle class="mb" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#2563eb" fill-opacity="0.88" stroke="#fff" stroke-width="2.2" data-n="'+c.name+'" data-p="'+c.pcs.toLocaleString()+'" data-pct="'+c.pct+'" data-c="'+c.chg+'" data-u="'+up+'" data-cd="'+(c.code||'')+'" style="cursor:pointer"/>';
    const below=(c.code==='hk'||c.code==='tw'||c.code==='sg'||c.code==='th');
    const y1=below?(cy+r+14):(cy-r-30);
    lbl+='<text x="'+cx+'" y="'+y1+'" text-anchor="middle" fill="#17324d" font-weight="800" font-size="12" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="3" font-family="Noto Sans KR,sans-serif">'+c.name+'</text>';
    lbl+='<text x="'+cx+'" y="'+(y1+14)+'" text-anchor="middle" fill="#2d567a" font-weight="700" font-size="11" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="3" font-family="Figtree,sans-serif">'+c.pcs.toLocaleString()+' PCS</text>';
    lbl+='<text x="'+cx+'" y="'+(y1+26)+'" text-anchor="middle" fill="#4a7090" font-weight="600" font-size="10" pointer-events="none" paint-order="stroke" stroke="#eef6ff" stroke-width="2" font-family="Figtree,sans-serif">('+c.pct+')</text>';
  });
  box.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+bw+'" height="'+bh+'" style="display:block;border-radius:16px;cursor:grab"><rect width="'+bw+'" height="'+bh+'" fill="#eef6ff"/>'+bubb+lbl+'<circle cx="20" cy="'+(bh-20)+'" r="7" fill="#2563eb" fill-opacity=".9"/><text x="33" y="'+(bh-15)+'" fill="#4a6278" font-size="13" font-weight="700">출고 PCS</text></svg><div class="map-tooltip"></div>';
  if(cid==='map1'){
    const zb=document.createElement('div');zb.className='map-zoom-btns';
    zb.innerHTML='<button class="map-zoom-btn" onclick="map1Zoom(1.25)">+</button><button class="map-zoom-btn" onclick="map1Zoom(0.8)">−</button><button class="map-zoom-btn" onclick="map1Reset()" style="font-size:12px">⊙</button>';
    box.appendChild(zb);
  }
  _bindTooltip(box,bw,bh);
  _bindDrag(cid);
}

function _bindTooltip(box,bw,bh){
  const tt=box.querySelector('.map-tooltip');if(!tt)return;
  box.querySelectorAll('.mb').forEach(el=>{
    el.addEventListener('mouseenter',e=>{
      const up=el.dataset.u==='true',cd=el.dataset.cd;
      const fl=cd?'<img src="https://flagcdn.com/'+cd+'.svg" style="width:20px;height:14px;border-radius:2px;margin-right:6px">':'';
      tt.innerHTML='<div class="t-title">'+fl+el.dataset.n+'</div><div class="t-main">'+el.dataset.p+' PCS</div><div class="t-sub">비중 '+el.dataset.pct+' · 전월 <b class="'+(up?'up':'down')+'">'+el.dataset.c+'</b></div>';
      const rc=box.getBoundingClientRect();
      let l=e.clientX-rc.left+14,t=e.clientY-rc.top-18;
      if(l+210>bw)l=e.clientX-rc.left-225;
      if(t+110>bh)t=bh-118;if(t<6)t=6;
      tt.style.left=l+'px';tt.style.top=t+'px';tt.style.display='block';
      el.setAttribute('fill-opacity','1');el.setAttribute('stroke-width','3.2');
    });
    el.addEventListener('mouseleave',()=>{
      tt.style.display='none';el.setAttribute('fill-opacity','.92');el.setAttribute('stroke-width','2.2');
    });
  });
}

function _bindDrag(cid){
  const box=document.getElementById(cid);if(!box)return;
  const svg=box.querySelector('svg');if(!svg)return;
  const isModal=(cid==='mapModal');

  svg.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('mb'))return;
    if(isModal){modalDragging=true;modalDragSX=e.clientX;modalDragSY=e.clientY;modalDragOX=modalOffX;modalDragOY=modalOffY;}
    else{mapDragging=true;mapDragSX=e.clientX;mapDragSY=e.clientY;mapDragOX=mapOffX;mapDragOY=mapOffY;}
    svg.style.cursor='grabbing';e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(isModal&&modalDragging){
      modalOffX=modalDragOX+(e.clientX-modalDragSX)/modalScale;
      modalOffY=modalDragOY+(e.clientY-modalDragSY)/modalScale;
      _applyTransform(cid);
    } else if(!isModal&&mapDragging){
      mapOffX=mapDragOX+(e.clientX-mapDragSX)/mapScale;
      mapOffY=mapDragOY+(e.clientY-mapDragSY)/mapScale;
      _applyTransform(cid);
    }
  });
  window.addEventListener('mouseup',()=>{
    mapDragging=false;modalDragging=false;
    if(svg)svg.style.cursor='grab';
  });

  // 스크롤 줌
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const factor=e.deltaY<0?1.1:0.91;
    if(isModal){modalScale=Math.min(Math.max(modalScale*factor,0.6),5);_applyTransform(cid);}
    else{mapScale=Math.min(Math.max(mapScale*factor,0.6),5);_applyTransform(cid);}
  },{passive:false});
}

// 메인지도 줌
function map1Zoom(f){mapScale=Math.min(Math.max(mapScale*f,0.5),5);_applyTransform('map1');}
function map1Reset(){mapScale=1;mapOffX=0;mapOffY=0;_applyTransform('map1');}
// 모달지도 줌
function modalZoom(f){modalScale=Math.min(Math.max(modalScale*f,0.5),5);_applyTransform('mapModal');}
function modalReset(){modalScale=1;modalOffX=0;modalOffY=0;_applyTransform('mapModal');}

function drawRiskChart(){
  const months=['1월','2월','3월','4월'];
  const exps=[DATA[1].export,DATA[2].export,DATA[3].export,DATA[4].export];
  const doms=[DATA[1].domestic,DATA[2].domestic,DATA[3].domestic,DATA[4].domestic];
  const ctx=document.getElementById('riskTrendChart');if(!ctx)return;
  if(riskChartInst)riskChartInst.destroy();
  riskChartInst=new Chart(ctx,{type:'bar',data:{labels:months,datasets:[
    {label:'수출',data:exps,backgroundColor:'rgba(37,99,235,.70)',borderRadius:5},
    {label:'국내',data:doms,backgroundColor:'rgba(5,150,105,.65)',borderRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{font:{size:13,weight:'700'},color:'#4a6278',boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.raw.toLocaleString()+' PCS'}}},scales:{x:{ticks:{font:{size:13,weight:'700'},color:'#4a6278'}},y:{ticks:{font:{size:12},color:'#7a90a3',callback:v=>v>=1000?(v/1000).toFixed(0)+'K':v},grid:{color:'#eaf0f6'}}}}});
}

function openMapModal(){
  document.getElementById('map-modal').classList.add('open');
  modalScale=1;modalOffX=0;modalOffY=0;
  renderTables();
  setTimeout(()=>drawMap('mapModal'),80);
}
function closeMapModal(){document.getElementById('map-modal').classList.remove('open');}

// 초기화
renderTables();
updateInventory(currentData);
(function tryMap(n){
  const b=document.getElementById('map1');
  if(b&&b.offsetWidth>10)drawMap('map1');
  else if(n<20)setTimeout(()=>tryMap(n+1),150);
})(0);
window.addEventListener('resize',()=>drawMap('map1'));
</script>
